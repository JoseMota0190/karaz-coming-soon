<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaz — Próximamente</title>

  <!-- Etiquetas para previsualización en redes sociales (Open Graph) -->
  <meta property="og:title" content="Karaz | Próximamente">
  <meta property="og:description" content="Joyería con identidad atemporal y elegante. Calabozo, Venezuela.">
  <meta property="og:image" content="https://karazvzla.com/imagen.png">
  <meta property="og:url" content="https://karazvzla.com">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #F5EDE4, #e6d8c8 80%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
      position: relative;
    }

    /* Texturas de fondo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
      opacity: 0.25;
      pointer-events: none;
    }

    .container {
      position: relative;
      animation: fadeIn 2.5s ease forwards;
      opacity: 0;
      transform: translateY(20px);
      width: 100%; /* Asegura que el contenedor sea flexible */
      display: flex;
      justify-content: center;
    }

    img {
      /* Ajuste clave para móvil: 92vw para que ocupe casi todo el ancho */
      width: 92vw; 
      max-width: 800px; /* Límite para que no se vea gigante en PC */
      height: auto;
      border-radius: 12px;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.25),
        0 0 20px rgba(179, 117, 54, 0.12);
      animation: float 8s ease-in-out infinite;
      transition: transform 0.6s ease;
      display: block;
    }

    /* Ocultar el brillo del sello en móviles si interfiere con la legibilidad, 
       o ajustarlo para que sea proporcional */
    @media (max-width: 600px) {
      .seal-shine {
        width: 80px;
        height: 80px;
      }
      img {
        width: 95vw; /* Casi borde a borde en celulares */
      }
    }

    .seal-shine {
      position: absolute;
      width: 110px;
      height: 110px;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }

    .seal-shine::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        120deg,
        transparent 40%,
        rgba(255,255,255,0.25) 50%,
        transparent 60%
      );
      transform: translateX(-100%) rotate(25deg);
      animation: sealGlow 7s infinite;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, transparent 65%, rgba(0,0,0,0.25));
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes sealGlow {
      0% { transform: translateX(-100%) rotate(25deg); opacity: 0; }
      40% { opacity: 1; }
      60% { opacity: 1; }
      100% { transform: translateX(100%) rotate(25deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Reemplaza "imagen.png" por tu URL real de Cloudflare -->
    <img src="imagen.png" alt="Karaz Coming Soon">
    <div class="seal-shine"></div>
  </div>

  <div class="vignette"></div>

</body>
</html>
